name: Deploy Catechism Time to droplet

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catechism-production
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEPLOY_ROOT: /srv/catechism-review-kids
      DEPLOY_HOST: ${{ secrets.DROPLET_HOST }}
      DEPLOY_USER: ${{ secrets.DROPLET_USER }}
      DEPLOY_KEY: ${{ secrets.DROPLET_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DROPLET_KNOWN_HOSTS }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Fail closed when deployment secrets are missing
        shell: bash
        run: |
          set -euo pipefail
          for value in DEPLOY_HOST DEPLOY_USER DEPLOY_KEY DEPLOY_KNOWN_HOSTS; do
            if [[ -z "${!value}" ]]; then
              echo "Required deployment secret for ${value} is missing." >&2
              exit 1
            fi
          done

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run complete verification and build
        run: npm run verify

      - name: Package verified site
        run: tar -C dist -czf "catechism-dist-${GITHUB_SHA}.tar.gz" .

      - name: Upload verified site artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: catechism-dist-${{ github.sha }}
          path: catechism-dist-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "${HOME}/.ssh"
          printf '%s\n' "${DEPLOY_KEY}" > "${HOME}/.ssh/deploy_key"
          chmod 600 "${HOME}/.ssh/deploy_key"
          printf '%s\n' "${DEPLOY_KNOWN_HOSTS}" > "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/known_hosts"

      - name: Create immutable release directory
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "${HOME}/.ssh/deploy_key" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "install -d -m 755 '${DEPLOY_ROOT}/releases/${GITHUB_SHA}'"

      - name: Upload verified dist
        shell: bash
        run: |
          set -euo pipefail
          manifest="$(mktemp)"
          (
            cd dist
            find . -type f -print0 |
              sort -z |
              xargs -0 sha256sum
          ) > "$manifest"
          mv -- "$manifest" dist/.sha256
          rsync -rlptDz --delete --checksum \
            -e "ssh -i ${HOME}/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes" \
            dist/ "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_ROOT}/releases/${GITHUB_SHA}/"

      - name: Verify release and switch current atomically
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "${HOME}/.ssh/deploy_key" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s -- "${GITHUB_SHA}" <<'REMOTE'
          set -euo pipefail
          root=/srv/catechism-review-kids
          sha="$1"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          release="$root/releases/$sha"
          [[ -s "$release/index.html" ]]
          [[ -s "$release/.sha256" ]]
          (cd "$release" && sha256sum --check --strict .sha256)
          grep -q '<title>Catechism Time</title>' "$release/index.html"
          grep -q '<div id="root"></div>' "$release/index.html"
          mapfile -t referenced_assets < <(
            grep -oE '(src|href)="\./assets/[^"]+"' "$release/index.html" |
              sed -E 's/^(src|href)="\.\///; s/"$//'
          )
          ((${#referenced_assets[@]} >= 2))
          for asset in "${referenced_assets[@]}"; do
            [[ "$asset" =~ ^assets/[A-Za-z0-9._-]+$ ]]
            [[ -s "$release/$asset" ]]
          done
          cd "$root"
          previous=""
          if [[ -L current ]]; then
            previous="$(readlink current)"
            [[ "$previous" =~ ^releases/[0-9a-f]{40}$ ]]
            [[ -s "$root/$previous/index.html" ]]
            grep -q '<title>Catechism Time</title>' "$root/$previous/index.html"
          elif [[ -e current ]]; then
            echo "Refusing to replace a current path that is not a symlink." >&2
            exit 1
          fi
          rm -f -- ".current-$sha"
          ln -s "releases/$sha" ".current-$sha"
          mv -Tf ".current-$sha" current
          rollback() {
            status=$?
            trap - ERR
            echo "Post-switch validation failed; restoring prior release." >&2
            if [[ -n "$previous" ]]; then
              rm -f -- ".rollback-$sha"
              ln -s "$previous" ".rollback-$sha"
              mv -Tf ".rollback-$sha" current
            else
              [[ -L current ]]
              rm -f -- current
            fi
            exit "$status"
          }
          trap rollback ERR
          deployed_html="$(curl --fail --silent --show-error --insecure \
            --resolve catechism.kylelynch.us:443:127.0.0.1 \
            https://catechism.kylelynch.us/)"
          grep -q '<title>Catechism Time</title>' <<<"$deployed_html"
          grep -q '<div id="root"></div>' <<<"$deployed_html"
          deployed_asset="$(grep -oE '(src|href)="\./assets/[^"]+"' <<<"$deployed_html" | sed -E -n '1{s/^(src|href)="\.\///; s/"$//; p;}')"
          [[ "$deployed_asset" =~ ^assets/[A-Za-z0-9._-]+$ ]]
          curl --fail --silent --show-error --insecure --output /dev/null \
            --resolve catechism.kylelynch.us:443:127.0.0.1 \
            "https://catechism.kylelynch.us/$deployed_asset"
          curl --fail --silent --show-error --insecure \
            --resolve catechism.kylelynch.us:443:127.0.0.1 \
            https://catechism.kylelynch.us/healthz
          trap - ERR
          current_target="$(readlink current)"
          mapfile -d '' old_releases < <(
            find "$root/releases" -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\0' |
              sort -zrn |
              tail -z -n +6 |
              cut -z -d ' ' -f 2-
          )
          for release in "${old_releases[@]}"; do
            name="${release##*/}"
            if [[ "$release" == "$root/releases/$name" && "$name" =~ ^[0-9a-f]{40}$ ]]; then
              if [[ "releases/$name" == "$current_target" || "releases/$name" == "$previous" ]]; then
                continue
              fi
              rm -rf -- "$release"
            else
              echo "Refusing to remove unexpected release path: $release" >&2
              exit 1
            fi
          done
          REMOTE

      - name: Remove local SSH key
        if: always()
        shell: bash
        run: rm -f -- "${HOME}/.ssh/deploy_key"
